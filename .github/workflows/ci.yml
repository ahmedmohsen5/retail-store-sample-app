name: CI - Changed Services

on:
  pull_request:
    branches:
      - main
      - develop
      - ci/day-11-security-gates
      
  push:
    branches:
      - main
      - develop
      - ci/day-11-security-gates

permissions:
  contents: read

concurrency:
  group: day09-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect changed services
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
      has_changes: ${{ steps.changes.outputs.has_changes }}
      services: ${{ steps.changes.outputs.services }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false


      - name: print pipline information
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Commit SHA: $GITHUB_SHA"
          echo 
          echo "Latest Commit:"
          git log -1 --oneline

      - name: Detect changed services
        id: changes
        env:
          event_name: ${{ github.event_name }}
          base_sha: ${{ github.event.pull_request.base.sha || github.event.before }}
          head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "Base SHA: $base_sha"
          echo "Head SHA: $head_sha"
          echo "Event Name: $event_name"

          if [ "$event_name" == "pull_request" ]; then
            DIFF_BASE=$(git merge-base $base_sha $head_sha)
          else
            DIFF_BASE=$base_sha
          fi

          if [ -z "$DIFF_BASE" ] || [[ "$DIFF_BASE" =~ ^0+$ ]] ; then
            DIFF_BASE=$(git rev-parse "$head_sha^" 2>/dev/null || git rev-list --max-parents=0 "$head_sha")
          fi
          echo
          echo "comparing "
          echo "  base: $DIFF_BASE"
          echo "  head: $head_sha"
          changed_files=$(git diff --name-only $DIFF_BASE $head_sha)
          echo "Changed files:" 
          echo "$changed_files"
          services=()

          if echo "$changed_files" | grep -q "^.github/workflows/ci.yml$"; then 
            services=(
              "cart"
              "catalog"
              "checkout"
              "orders"
              "ui"
            )
          else
            for service in cart catalog checkout orders ui; do
              if echo "$changed_files" | grep -q "^src/${service}/"; then
                services+=("$service")
              fi
            done
          fi
          if [ ${#services[@]} -eq 0 ]; then
            echo "No services changed."
            MATRIX='[]'
            HAS_CHANGES=false
            SERVICE_LIST='none'
          else
            JSON_ITEMS=$(printf '"%s",' "${services[@]}")
            MATRIX="[${JSON_ITEMS%,}]"
            HAS_CHANGES=true
            SERVICE_LIST=$(IFS=,; echo "${services[*]}")
          fi
          echo
          echo "Matrix:"
          echo "$MATRIX"

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "has_changes=$HAS_CHANGES" >> $GITHUB_OUTPUT
          echo "services=$SERVICE_LIST" >> $GITHUB_OUTPUT

  service-ci:
    name: CI - ${{matrix.service}}
    needs: detect
    runs-on: ubuntu-latest
    if: needs.detect.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        service: ${{fromJSON(needs.detect.outputs.matrix)}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      
      - name: Show selected service
        run: |
          echo "================================"
          echo "Service: ${{ matrix.service }}"
          echo "================================"
      
      - name: Validate service directory
        run: |
          SERVICE_PATH="src/${{ matrix.service }}"
          echo "Checking....."
          echo "Service Path: $SERVICE_PATH"
          if [ ! -d "$SERVICE_PATH" ]; then
            echo "Error: Service directory '$SERVICE_PATH' does not exist."
            exit 1
          fi
          echo "Service directory exists: $SERVICE_PATH"
      
      - name: Validate Dockerfile 
        run: |
          Dockerfile_PATH="src/${{ matrix.service }}/Dockerfile"
          echo "Checking....."
          echo "Dockerfile Path: $Dockerfile_PATH"
          if [ ! -f "$Dockerfile_PATH" ]; then
            echo "Error: Dockerfile '$Dockerfile_PATH' does not exist."
            exit 1
          fi
          echo "Dockerfile exists: $Dockerfile_PATH"
      
      - name: set up java 21
        if: >
          matrix.service == 'cart' ||  matrix.service == 'orders' || matrix.service == 'ui'
        uses: actions/setup-java@v5
        with:
          cache: maven
          cache-dependency-path: src/${{ matrix.service }}/pom.xml
          java-version: 21
          distribution: temurin
      - name: validate cart service
        if: matrix.service == 'cart'
        working-directory: src/cart
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw
          set -o pipefail
          ./mvnw --batch-mode --no-transfer-progress verify 2>&1 | tee "$RUNNER_TEMP/cart-test.log"
      - name: validate java service 
        if: matrix.service == 'orders' || matrix.service == 'ui'
        working-directory: src/${{ matrix.service }}
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw
          set -o pipefail
          ./mvnw --batch-mode --no-transfer-progress verify 2>&1 | tee "$RUNNER_TEMP/${{ matrix.service }}-test.log"

      - name: setup node 20
        if: matrix.service == 'checkout' 
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: src/checkout/package-lock.json
      - name: validate checkout service
        if: matrix.service == 'checkout'
        working-directory: src/checkout
        run: |
          npm ci
          npm run lint --if-present
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/checkout-test.log"
          npm run build 
      - name: setup go 1.25.13
        if: matrix.service == 'catalog'
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.13'
          cache: true
          cache-dependency-path: src/catalog/go.sum
      - name: validate catalog service
        if: matrix.service == 'catalog'
        working-directory: src/catalog
        env:
          CGO_ENABLED: '1'
        run: |
          
          go vet ./...
          
          set -o pipefail
          go test -v ./... 2>&1 | tee "$RUNNER_TEMP/catalog-test.log"
          go build ./...
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-${{ matrix.service }}-${{ github.run_id }}
          path: |
              ${{ runner.temp }}/${{ matrix.service }}-test.log
              src/${{ matrix.service }}/target/surefire-reports/**
              src/${{ matrix.service }}/target/failsafe-reports/**
              src/checkout/coverage/**
          if-no-files-found: warn
          retention-days: 7
      - name: setup docker buildx
        uses: docker/setup-buildx-action@v4
      
      - name: prepare image metadata
        id: image_meta
        run: |
          echo "short_sha=${GITHUB_SHA::12}" >> $GITHUB_OUTPUT
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          echo "release_tag=run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: build service image
        uses: docker/build-push-action@v7
        with:
          context: src/${{ matrix.service }}
          file: src/${{ matrix.service }}/Dockerfile
          push: false
          tags: retail-${{ matrix.service }}:sha-${{ steps.image_meta.outputs.short_sha }}
          load: true
          labels: |
             org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
             org.opencontainers.image.revision=${{ github.sha }}
             org.opencontainers.image.created=${{ steps.image_meta.outputs.created }}
             org.opencontainers.image.version=${{ steps.image_meta.outputs.release_tag }}

          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: verify service image
        run: |
          IMAGE=retail-${{ matrix.service }}:sha-${{ steps.image_meta.outputs.short_sha }}
          echo "Image: $IMAGE"
          docker image inspect "$IMAGE" 
          echo "Image $IMAGE built successfully."
          docker image inspect "$IMAGE" --format '{{json .Config.Labels}}' 

      - name: scan service dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: src/${{ matrix.service }}
          scanners: "vuln"
          format: sarif
          output: trivy-fs-${{ matrix.service }}.sarif
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          timeout: "15m0s"
          limit-severities-for-sarif: true

      - name: scan built service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "image"
          image-ref: retail-${{ matrix.service }}:sha-${{ steps.image_meta.outputs.short_sha }}
          format: sarif
          output: trivy-image-${{ matrix.service }}.sarif
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          timeout: "15m0s"
          limit-severities-for-sarif: true

      - name: Upload service security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-${{ matrix.service }}-${{ github.run_id }}
          path: |
            trivy-fs-${{ matrix.service }}.sarif
            trivy-image-${{ matrix.service }}.sarif
          if-no-files-found: warn
          retention-days: 14
      - name: save approved image
        run: |
          IMAGE="retail-${{ matrix.service }}:sha-${{ steps.image_meta.outputs.short_sha }}"
          ARTIFACT_DIR="$RUNNER_TEMP/approved-image"

          mkdir -p "$ARTIFACT_DIR"

          docker save "$IMAGE" \
            --output "$ARTIFACT_DIR/${{ matrix.service }}.tar"

          cd "$ARTIFACT_DIR"

          sha256sum "${{ matrix.service }}.tar" \
            > "${{ matrix.service }}.tar.sha256"
      - name: upload approved image
        uses: actions/upload-artifact@v7.0.1
        with:
          name: approved-image-${{ matrix.service }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/approved-image/${{ matrix.service }}.tar
            ${{ runner.temp }}/approved-image/${{ matrix.service }}.tar.sha256
          if-no-files-found: error
          retention-days: 1

  no-service-changes:
    name: No application changes
    needs: detect
    runs-on: ubuntu-latest
    if: needs.detect.outputs.has_changes == 'false'
    steps:
      - name: Skip application CI
        run: |
          echo "No application service changed."
          echo "Application build jobs are skipped."
      
  


  repository-security:
    name: Repository Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository for security scans
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
      
      - name: setup helm chart 
        uses: azure/setup-helm@v4
      
      - name: prepare helm dependency
        run: helm dependency update src/app/chart
      - name: scan dockerfile and iac
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_TF_EXCLUDE_DOWNLOADED_MODULES: "true"
        with:
          scan-type: "config"
          scan-ref: .
          format: sarif
          output: "trivy-config.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          timeout: "15m0s"
          trivyignores: ".trivyignore.yaml"
          limit-severities-for-sarif: true
      - name: Upload Trivy SARIF report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-config-sarif-${{ github.run_id }}
          path: trivy-config.sarif
          if-no-files-found: warn
          retention-days: 14
  
  security-gate:
    name: Release Security Gate
    needs: [service-ci, repository-security, no-service-changes]
    runs-on: ubuntu-latest  
    if: always()
    steps:
      - name: enforce release gate
        env:
          REPOSITORY_SECURITY: ${{ needs.repository-security.result }}
          SERVICE_CI: ${{ needs.service-ci.result }}
        run: |
          echo "Repository security: $REPOSITORY_SECURITY"
          echo "Service CI: $SERVICE_CI"
          if [ "$REPOSITORY_SECURITY" = "failure" ]; then
            echo "Release gate failed due to security issues or service CI failures."
            exit 1
          else
            echo "Release gate passed. No security issues or service CI failures detected."
          fi
          if [ "$SERVICE_CI" != "success" ] && [ "$SERVICE_CI" != "skipped" ]; then
            echo "Release block: service ci failed"
            exit 1
          fi

          echo "Release gate passed. No security issues or service CI failures detected."
  release:
    name: Publish - ${{ matrix.service }}   
    needs: 
      - detect
      - service-ci
      - repository-security
      - security-gate 
    if: > 
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      needs.detect.outputs.has_changes == 'true' &&
      needs.service-ci.result == 'success' &&
      needs.repository-security.result == 'success' &&
      needs.security-gate.result == 'success'
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: login to amazon ecr 
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2.1.6
        with:
          mask-password: true
      
      - name: download docker images 
        uses: actions/download-artifact@v8.0.1
        with:
           name: approved-image-${{ matrix.service }}-${{ github.sha }}
           path: ${{ runner.temp }}/approved-image
      - name:  Verify and load approved image
        run: | 
          cd "$RUNNER_TEMP/approved-image"
          sha256sum -c "${{ matrix.service }}.tar.sha256"
          docker load --input "${{matrix.service}}.tar"
      - name: Prepare release references
        id: release_meta
        shell: bash
        run: |
          SERVICE="${{ matrix.service}}"
          SHORT_SHA="${GITHUB_SHA::12}"
          SHA_TAG="sha-${SHORT_SHA}"
          RELEASE_TAG="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          

            case "$SERVICE" in
            cart)
              REPOSITORY_NAME="retail-carts"
              ;;
            catalog|checkout|orders|ui)
              REPOSITORY_NAME="retail-${SERVICE}"
              ;;
            *)
              echo "Unsupported service: $SERVICE"
              exit 1
              ;;
          esac

          REPOSITORY_URI=$(aws ecr describe-repositories \
            --repository-names "$REPOSITORY_NAME" \
            --query 'repositories[0].repositoryUri' \
            --output text)

          LOCAL_IMAGE="retail-${SERVICE}:${SHA_TAG}"

          echo "repository_name=$REPOSITORY_NAME" >> "$GITHUB_OUTPUT"
          echo "repository_uri=$REPOSITORY_URI" >> "$GITHUB_OUTPUT"
          echo "local_image=$LOCAL_IMAGE" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Tag approved image for ECR
        run: |
          docker tag \
            "${{ steps.release_meta.outputs.local_image }}" \
            "${{ steps.release_meta.outputs.repository_uri }}:${{ steps.release_meta.outputs.sha_tag }}"

          docker tag \
            "${{ steps.release_meta.outputs.local_image }}" \
            "${{ steps.release_meta.outputs.repository_uri }}:${{ steps.release_meta.outputs.release_tag }}"

      - name: Push approved image
        id: push
        shell: bash
        run: |
          SHA_IMAGE="${{ steps.release_meta.outputs.repository_uri }}:${{ steps.release_meta.outputs.sha_tag }}"
          RELEASE_IMAGE="${{ steps.release_meta.outputs.repository_uri }}:${{ steps.release_meta.outputs.release_tag }}"
          PUSH_OUTPUT=$(docker push "$SHA_IMAGE" )
          echo "$PUSH_OUTPUT"
          PIPELINE_DIGEST=$(printf '%s\n' "$PUSH_OUTPUT" \
          | awk '/digest:/ {print $3}' \
          | tail -1)

          if [ -z "$PIPELINE_DIGEST" ]; then
            echo "Could not determine pushed digest."
            exit 1
          fi

          docker push "$RELEASE_IMAGE"

          echo "pipeline_digest=$PIPELINE_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Verify ECR digest
        id: digest
        shell: bash
        run: |
          ECR_DIGEST=$(aws ecr describe-images \
            --repository-name "${{ steps.release_meta.outputs.repository_name }}" \
            --image-ids imageTag="${{ steps.release_meta.outputs.sha_tag }}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          PIPELINE_DIGEST="${{ steps.push.outputs.pipeline_digest }}"

          echo "Pipeline digest: $PIPELINE_DIGEST"
          echo "ECR digest:      $ECR_DIGEST"

          if [ "$PIPELINE_DIGEST" != "$ECR_DIGEST" ]; then
            echo "Digest mismatch."
            exit 1
          fi

          echo "Digest verified successfully."

          echo "ecr_digest=$ECR_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Pull published image and verify digest
        shell: bash
        run: |
            IMAGE_URI="${{ steps.release_meta.outputs.repository_uri }}:${{ steps.release_meta.outputs.sha_tag }}"

            docker image rm "$IMAGE_URI" || true
            docker image rm "${{ steps.release_meta.outputs.local_image }}" || true

            docker pull "$IMAGE_URI"

            PULLED_REPO_DIGEST=$(docker image inspect "$IMAGE_URI" \
              --format '{{index .RepoDigests 0}}')

            PULLED_DIGEST="${PULLED_REPO_DIGEST##*@}"

            EXPECTED_DIGEST="${{ steps.digest.outputs.ecr_digest }}"

            echo "Pulled digest:   $PULLED_DIGEST"
            echo "Expected digest: $EXPECTED_DIGEST"

            if [ "$PULLED_DIGEST" != "$EXPECTED_DIGEST" ]; then
              echo "Pulled image digest mismatch."
              exit 1
            fi

            echo "Pulled image digest verified."
      - name: Verify release tag is immutable
        shell: bash
        run: |
          RELEASE_IMAGE="${{ steps.release_meta.outputs.repository_uri }}:${{ steps.release_meta.outputs.release_tag }}"

          echo "Attempting a second push to existing immutable tag: $RELEASE_IMAGE"

          if docker push "$RELEASE_IMAGE"; then
            echo "ERROR: Existing release tag accepted another push."
            exit 1
          else
            echo "Expected failure: immutable release tag cannot be overwritten."
          fi
      - name: Print release evidence
        run: |
          echo "Service:        ${{ matrix.service }}"
          echo "Repository:     ${{ steps.release_meta.outputs.repository_uri }}"
          echo "SHA tag:        ${{ steps.release_meta.outputs.sha_tag }}"
          echo "Release tag:    ${{ steps.release_meta.outputs.release_tag }}"
          echo "Digest:         ${{ steps.digest.outputs.ecr_digest }}"
          echo "Commit:         ${{ github.sha }}"
          echo "Run ID:         ${{ github.run_id }}"
    


